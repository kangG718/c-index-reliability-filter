<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <style>
    .title { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 48px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 25px; fill: #475569; }
    .panel-title { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 31px; font-weight: 700; fill: #0f172a; }
    .axis { stroke: #cbd5e1; stroke-width: 2; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .tick { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 17px; fill: #64748b; }
    .label { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 23px; font-weight: 700; fill: #0f172a; }
    .value { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .delta { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 22px; font-weight: 700; fill: #0f766e; }
    .legend { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 22px; fill: #334155; }
    .note { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 23px; font-weight: 600; fill: #334155; }
    .small { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 18px; fill: #64748b; }
    .before { fill: #94a3b8; }
    .after { fill: #0f766e; }
    .panel { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; rx: 18; }
  </style>

  <text x="800" y="78" text-anchor="middle" class="title">Result 2: Risk Handling</text>
  <text x="800" y="120" text-anchor="middle" class="subtitle">C-index 필터링 이후 수익 안정성은 높아지고, 최대 손실 위험은 완화됨</text>

  <rect x="1060" y="156" width="22" height="22" class="before"/>
  <text x="1098" y="175" class="legend">No Filter</text>
  <rect x="1250" y="156" width="22" height="22" class="after"/>
  <text x="1288" y="175" class="legend">C-index Filter</text>

  <!-- Left panel: Sharpe -->
  <rect x="80" y="205" width="690" height="560" class="panel"/>
  <text x="425" y="255" text-anchor="middle" class="panel-title">Sharpe Ratio</text>
  <text x="425" y="286" text-anchor="middle" class="small">higher is better</text>

  <!-- chart area left x 160-720 y 330-680, max .35 -->
  <line x1="155" y1="680" x2="720" y2="680" class="axis"/>
  <line x1="155" y1="330" x2="155" y2="680" class="axis"/>
  <line x1="155" y1="580" x2="720" y2="580" class="grid"/>
  <line x1="155" y1="480" x2="720" y2="480" class="grid"/>
  <line x1="155" y1="380" x2="720" y2="380" class="grid"/>
  <text x="132" y="686" text-anchor="end" class="tick">0.0</text>
  <text x="132" y="586" text-anchor="end" class="tick">0.1</text>
  <text x="132" y="486" text-anchor="end" class="tick">0.2</text>
  <text x="132" y="386" text-anchor="end" class="tick">0.3</text>

  <!-- Sharpe bars: scale y=680-value*1000 -->
  <!-- GBM 0.185 0.321 -->
  <rect x="230" y="494.6" width="48" height="185.4" rx="7" class="before"/>
  <rect x="292" y="358.8" width="48" height="321.2" rx="7" class="after"/>
  <text x="254" y="482" text-anchor="middle" class="value">0.185</text>
  <text x="316" y="346" text-anchor="middle" class="value">0.321</text>
  <text x="285" y="721" text-anchor="middle" class="label">GBM</text>
  <text x="285" y="751" text-anchor="middle" class="delta">+0.136</text>

  <!-- MLP 0.138 0.221 -->
  <rect x="405" y="541.8" width="48" height="138.2" rx="7" class="before"/>
  <rect x="467" y="458.8" width="48" height="221.2" rx="7" class="after"/>
  <text x="429" y="529" text-anchor="middle" class="value">0.138</text>
  <text x="491" y="446" text-anchor="middle" class="value">0.221</text>
  <text x="460" y="721" text-anchor="middle" class="label">MLP</text>
  <text x="460" y="751" text-anchor="middle" class="delta">+0.083</text>

  <!-- RF 0.133 0.191 -->
  <rect x="580" y="547.4" width="48" height="132.6" rx="7" class="before"/>
  <rect x="642" y="489.4" width="48" height="190.6" rx="7" class="after"/>
  <text x="604" y="535" text-anchor="middle" class="value">0.133</text>
  <text x="666" y="477" text-anchor="middle" class="value">0.191</text>
  <text x="635" y="721" text-anchor="middle" class="label">RF</text>
  <text x="635" y="751" text-anchor="middle" class="delta">+0.058</text>

  <!-- Right panel: MDD -->
  <rect x="830" y="205" width="690" height="560" class="panel"/>
  <text x="1175" y="255" text-anchor="middle" class="panel-title">Max Drawdown</text>
  <text x="1175" y="286" text-anchor="middle" class="small">closer to zero is better</text>

  <!-- chart area right x 905-1470 y 330-680, scale range 0 to -15, y=330+abs(v)/15*350 -->
  <line x1="905" y1="330" x2="1470" y2="330" class="axis"/>
  <line x1="905" y1="330" x2="905" y2="680" class="axis"/>
  <line x1="905" y1="446.7" x2="1470" y2="446.7" class="grid"/>
  <line x1="905" y1="563.3" x2="1470" y2="563.3" class="grid"/>
  <line x1="905" y1="680" x2="1470" y2="680" class="grid"/>
  <text x="882" y="336" text-anchor="end" class="tick">0</text>
  <text x="882" y="453" text-anchor="end" class="tick">-5</text>
  <text x="882" y="570" text-anchor="end" class="tick">-10</text>
  <text x="882" y="686" text-anchor="end" class="tick">-15</text>

  <!-- MDD bars downward from y=330 -->
  <!-- GBM -6.13 -> -2.96 -->
  <rect x="980" y="330" width="48" height="143.1" rx="7" class="before"/>
  <rect x="1042" y="330" width="48" height="69.0" rx="7" class="after"/>
  <text x="1004" y="493" text-anchor="middle" class="value">-6.13</text>
  <text x="1066" y="419" text-anchor="middle" class="value">-2.96</text>
  <text x="1035" y="721" text-anchor="middle" class="label">GBM</text>
  <text x="1035" y="751" text-anchor="middle" class="delta">+3.18</text>

  <!-- MLP -9.38 -> -7.96 -->
  <rect x="1155" y="330" width="48" height="218.8" rx="7" class="before"/>
  <rect x="1217" y="330" width="48" height="185.8" rx="7" class="after"/>
  <text x="1179" y="569" text-anchor="middle" class="value">-9.38</text>
  <text x="1241" y="536" text-anchor="middle" class="value">-7.96</text>
  <text x="1210" y="721" text-anchor="middle" class="label">MLP</text>
  <text x="1210" y="751" text-anchor="middle" class="delta">+1.41</text>

  <!-- RF -13.81 -> -10.99 -->
  <rect x="1330" y="330" width="48" height="322.2" rx="7" class="before"/>
  <rect x="1392" y="330" width="48" height="256.5" rx="7" class="after"/>
  <text x="1354" y="672" text-anchor="middle" class="value">-13.81</text>
  <text x="1416" y="607" text-anchor="middle" class="value">-10.99</text>
  <text x="1385" y="721" text-anchor="middle" class="label">RF</text>
  <text x="1385" y="751" text-anchor="middle" class="delta">+2.81</text>

  <text x="800" y="838" text-anchor="middle" class="note">All three models show higher Sharpe and less severe drawdown after C-index filtering.</text>
</svg>
