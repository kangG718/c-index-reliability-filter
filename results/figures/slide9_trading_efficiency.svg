<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <style>
    .title { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 50px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 26px; fill: #475569; }
    .axis { stroke: #cbd5e1; stroke-width: 2; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .label { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 26px; font-weight: 700; fill: #0f172a; }
    .tick { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 20px; fill: #64748b; }
    .value { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
    .reduction { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 25px; font-weight: 700; fill: #0f766e; }
    .legend { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 23px; fill: #334155; }
    .note { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 24px; font-weight: 600; fill: #334155; }
  </style>

  <text x="800" y="92" text-anchor="middle" class="title">Result 1: Trading Efficiency</text>
  <text x="800" y="136" text-anchor="middle" class="subtitle">C-index 필터링은 신뢰도가 낮은 거래 신호를 제거해 거래 빈도를 줄임</text>

  <rect x="1070" y="176" width="22" height="22" fill="#94a3b8"/>
  <text x="1108" y="195" class="legend">No Filter</text>
  <rect x="1260" y="176" width="22" height="22" fill="#0f766e"/>
  <text x="1298" y="195" class="legend">C-index Filter</text>

  <!-- chart area: x 190-1410, y 230-710, scale max 180 -->
  <line x1="210" y1="710" x2="1410" y2="710" class="axis"/>
  <line x1="210" y1="230" x2="210" y2="710" class="axis"/>

  <!-- horizontal grid lines for 0, 50, 100, 150 -->
  <line x1="210" y1="710" x2="1410" y2="710" class="grid"/>
  <line x1="210" y1="577" x2="1410" y2="577" class="grid"/>
  <line x1="210" y1="443" x2="1410" y2="443" class="grid"/>
  <line x1="210" y1="310" x2="1410" y2="310" class="grid"/>

  <text x="175" y="717" text-anchor="end" class="tick">0</text>
  <text x="175" y="584" text-anchor="end" class="tick">50</text>
  <text x="175" y="450" text-anchor="end" class="tick">100</text>
  <text x="175" y="317" text-anchor="end" class="tick">150</text>
  <text x="128" y="472" transform="rotate(-90 128 472)" text-anchor="middle" class="tick">Trade Count</text>

  <!-- GBM: no 67, filter 32, scale h=480/180=2.6667 -->
  <rect x="355" y="531.3" width="78" height="178.7" rx="8" fill="#94a3b8"/>
  <rect x="453" y="624.7" width="78" height="85.3" rx="8" fill="#0f766e"/>
  <text x="394" y="517" text-anchor="middle" class="value">67</text>
  <text x="492" y="611" text-anchor="middle" class="value">32</text>
  <text x="443" y="760" text-anchor="middle" class="label">GBM</text>
  <text x="443" y="800" text-anchor="middle" class="reduction">-52.2%</text>

  <!-- MLP: no 116, filter 66 -->
  <rect x="735" y="400.7" width="78" height="309.3" rx="8" fill="#94a3b8"/>
  <rect x="833" y="534.0" width="78" height="176.0" rx="8" fill="#0f766e"/>
  <text x="774" y="386" text-anchor="middle" class="value">116</text>
  <text x="872" y="520" text-anchor="middle" class="value">66</text>
  <text x="823" y="760" text-anchor="middle" class="label">MLP</text>
  <text x="823" y="800" text-anchor="middle" class="reduction">-43.1%</text>

  <!-- RF: no 172, filter 97 -->
  <rect x="1115" y="251.3" width="78" height="458.7" rx="8" fill="#94a3b8"/>
  <rect x="1213" y="451.3" width="78" height="258.7" rx="8" fill="#0f766e"/>
  <text x="1154" y="237" text-anchor="middle" class="value">172</text>
  <text x="1252" y="437" text-anchor="middle" class="value">97</text>
  <text x="1203" y="760" text-anchor="middle" class="label">RF</text>
  <text x="1203" y="800" text-anchor="middle" class="reduction">-43.6%</text>

  <text x="800" y="855" text-anchor="middle" class="note">Across all models, C-index filtering reduced trades by approximately 43-52%.</text>
</svg>
