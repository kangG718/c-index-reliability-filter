<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <style>
    .title { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 48px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 25px; fill: #475569; }
    .card { fill: none; stroke: none; }
    .card-title { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 34px; font-weight: 700; fill: #0f172a; }
    .axis { stroke: #cbd5e1; stroke-width: 2; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .bar-label { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 18px; font-weight: 700; fill: #334155; }
    .value { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 17px; font-weight: 700; fill: #0f172a; }
    .small { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 18px; fill: #64748b; }
    .badge-text { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
    .caption { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 22px; font-weight: 600; fill: #334155; }
    .legend { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 21px; fill: #334155; }
    .ci { fill: #0f766e; }
    .conf { fill: #1e3a8a; }
    .rand { fill: #94a3b8; }
    .limit { stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 7 6; }
    .good { fill: #ecfdf5; stroke: #99f6e4; stroke-width: 1.5; rx: 10; }
    .mixed { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.5; rx: 10; }
    .neutral { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
  </style>

  <text x="800" y="78" text-anchor="middle" class="title">Benchmark Comparison</text>
  <text x="800" y="120" text-anchor="middle" class="subtitle">C-index filter를 prediction confidence 및 random count-matched baseline과 비교함</text>

  <rect x="442" y="152" width="20" height="20" class="ci"/>
  <text x="474" y="170" class="legend">C-index</text>
  <rect x="612" y="152" width="20" height="20" class="conf"/>
  <text x="644" y="170" class="legend">Prob. Filter</text>
  <rect x="820" y="152" width="20" height="20" class="rand"/>
  <text x="852" y="170" class="legend">Random Mean</text>
  <line x1="1070" y1="162" x2="1118" y2="162" class="limit"/>
  <text x="1130" y="170" class="legend">Random 95%</text>

  <!-- Card layout x=80, 560, 1040; card width=480 -->
  <!-- Scale for Sharpe: width 300, max 0.40 -->

  <!-- GBM Card -->
  <rect x="80" y="210" width="440" height="570" class="card"/>
  <text x="300" y="258" text-anchor="middle" class="card-title">GBM</text>
  <text x="300" y="290" text-anchor="middle" class="small">Sharpe benchmark, 0bp</text>
  <line x1="170" y1="620" x2="465" y2="620" class="axis"/>
  <line x1="170" y1="350" x2="170" y2="620" class="axis"/>
  <line x1="244" y1="350" x2="244" y2="620" class="grid"/>
  <line x1="318" y1="350" x2="318" y2="620" class="grid"/>
  <line x1="392" y1="350" x2="392" y2="620" class="grid"/>
  <line x1="442.9" y1="344" x2="442.9" y2="626" class="limit"/>
  <text x="442.9" y="333" text-anchor="middle" class="small">R95 0.370</text>
  <text x="152" y="371" text-anchor="end" class="bar-label">C-index</text>
  <rect x="170" y="350" width="236.9" height="32" rx="7" class="ci"/>
  <text x="417" y="371" class="value">0.321</text>
  <text x="152" y="436" text-anchor="end" class="bar-label">Prob.</text>
  <rect x="170" y="415" width="114.4" height="32" rx="7" class="conf"/>
  <text x="295" y="436" class="value">0.155</text>
  <text x="152" y="501" text-anchor="end" class="bar-label">Random</text>
  <rect x="170" y="480" width="139.1" height="32" rx="7" class="rand"/>
  <text x="320" y="501" class="value">0.189</text>
  <text x="170" y="652" class="small">0</text>
  <text x="318" y="652" text-anchor="middle" class="small">0.20</text>
  <text x="465" y="652" text-anchor="end" class="small">0.40</text>
  <rect x="118" y="690" width="176" height="38" class="good"/>
  <text x="206" y="715" text-anchor="middle" class="badge-text">Avg Return ↑</text>
  <rect x="306" y="690" width="176" height="38" class="good"/>
  <text x="394" y="715" text-anchor="middle" class="badge-text">MDD better</text>
  <text x="300" y="752" text-anchor="middle" class="small">Confidence 대비 세 지표 모두 우위</text>

  <!-- MLP Card -->
  <rect x="580" y="210" width="440" height="570" class="card"/>
  <text x="800" y="260" text-anchor="middle" class="card-title">MLP</text>
  <text x="800" y="292" text-anchor="middle" class="small">Sharpe benchmark, 0bp</text>
  <line x1="670" y1="620" x2="965" y2="620" class="axis"/>
  <line x1="670" y1="350" x2="670" y2="620" class="axis"/>
  <line x1="744" y1="350" x2="744" y2="620" class="grid"/>
  <line x1="818" y1="350" x2="818" y2="620" class="grid"/>
  <line x1="891" y1="350" x2="891" y2="620" class="grid"/>
  <line x1="859.8" y1="344" x2="859.8" y2="626" class="limit"/>
  <text x="859.8" y="333" text-anchor="middle" class="small">R95 0.257</text>
  <text x="652" y="371" text-anchor="end" class="bar-label">C-index</text>
  <rect x="670" y="350" width="163.1" height="32" rx="7" class="ci"/>
  <text x="845" y="371" class="value">0.221</text>
  <text x="652" y="436" text-anchor="end" class="bar-label">Prob.</text>
  <rect x="670" y="415" width="125.1" height="32" rx="7" class="conf"/>
  <text x="807" y="436" class="value">0.170</text>
  <text x="652" y="501" text-anchor="end" class="bar-label">Random</text>
  <rect x="670" y="480" width="98.0" height="32" rx="7" class="rand"/>
  <text x="780" y="501" class="value">0.133</text>
  <text x="670" y="652" class="small">0</text>
  <text x="818" y="652" text-anchor="middle" class="small">0.20</text>
  <text x="965" y="652" text-anchor="end" class="small">0.40</text>
  <rect x="618" y="690" width="176" height="38" class="mixed"/>
  <text x="706" y="715" text-anchor="middle" class="badge-text">Avg Return ↓</text>
  <rect x="806" y="690" width="176" height="38" class="mixed"/>
  <text x="894" y="715" text-anchor="middle" class="badge-text">MDD worse</text>
  <text x="800" y="752" text-anchor="middle" class="small">Sharpe는 우위, 수익/MDD는 mixed</text>

  <!-- RF Card -->
  <rect x="1080" y="210" width="440" height="570" class="card"/>
  <text x="1300" y="260" text-anchor="middle" class="card-title">RF</text>
  <text x="1300" y="292" text-anchor="middle" class="small">Sharpe benchmark, 0bp</text>
  <line x1="1170" y1="620" x2="1465" y2="620" class="axis"/>
  <line x1="1170" y1="350" x2="1170" y2="620" class="axis"/>
  <line x1="1244" y1="350" x2="1244" y2="620" class="grid"/>
  <line x1="1318" y1="350" x2="1318" y2="620" class="grid"/>
  <line x1="1391" y1="350" x2="1391" y2="620" class="grid"/>
  <line x1="1349.6" y1="344" x2="1349.6" y2="626" class="limit"/>
  <text x="1349.6" y="333" text-anchor="middle" class="small">R95 0.244</text>
  <text x="1152" y="371" text-anchor="end" class="bar-label">C-index</text>
  <rect x="1170" y="350" width="140.6" height="32" rx="7" class="ci"/>
  <text x="1322" y="371" class="value">0.191</text>
  <text x="1152" y="436" text-anchor="end" class="bar-label">Prob.</text>
  <rect x="1170" y="415" width="84.7" height="32" rx="7" class="conf"/>
  <text x="1267" y="436" class="value">0.115</text>
  <text x="1152" y="501" text-anchor="end" class="bar-label">Random</text>
  <rect x="1170" y="480" width="97.3" height="32" rx="7" class="rand"/>
  <text x="1279" y="501" class="value">0.132</text>
  <text x="1170" y="652" class="small">0</text>
  <text x="1318" y="652" text-anchor="middle" class="small">0.20</text>
  <text x="1465" y="652" text-anchor="end" class="small">0.40</text>
  <rect x="1118" y="690" width="176" height="38" class="good"/>
  <text x="1206" y="715" text-anchor="middle" class="badge-text">Avg Return ↑</text>
  <rect x="1306" y="690" width="176" height="38" class="good"/>
  <text x="1394" y="715" text-anchor="middle" class="badge-text">MDD better</text>
  <text x="1300" y="752" text-anchor="middle" class="small">Confidence 대비 contribution 확인</text>

  <text x="800" y="835" text-anchor="middle" class="caption">C-index Sharpe exceeds confidence and random mean in all models, but does not exceed the random 95% benchmark.</text>
</svg>
