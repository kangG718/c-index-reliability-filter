<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>

  <style>
    .title { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 48px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 25px; font-weight: 400; fill: #475569; }
    .node-title { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 34px; font-weight: 700; fill: #0f172a; }
    .metric { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 28px; font-weight: 700; fill: #111827; }
    .note { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 23px; font-weight: 400; fill: #475569; }
    .small { font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 21px; font-weight: 400; fill: #64748b; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
    .head { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 20; }
    .line { stroke: #94a3b8; stroke-width: 3; fill: none; stroke-linecap: round; }
    .dot { fill: #0f766e; }
    .dot2 { fill: #1e3a8a; }
  </style>

  <text x="800" y="105" text-anchor="middle" class="title">Evaluation Metrics</text>
  <text x="800" y="148" text-anchor="middle" class="subtitle">거래 효율성과 위험 대응 관점에서 C-index 필터링 효과를 평가함</text>

  <rect x="610" y="205" width="380" height="92" class="head"/>
  <text x="800" y="263" text-anchor="middle" class="node-title">C-index Filtering Effect</text>

  <path d="M800 297 L800 355" class="line"/>
  <path d="M430 355 L1170 355" class="line"/>
  <path d="M430 355 L430 410" class="line"/>
  <path d="M1170 355 L1170 410" class="line"/>

  <rect x="180" y="410" width="500" height="78" class="head"/>
  <circle cx="225" cy="449" r="13" class="dot"/>
  <text x="250" y="459" class="node-title">Trading Efficiency</text>

  <rect x="920" y="410" width="500" height="78" class="head"/>
  <circle cx="965" cy="449" r="13" class="dot2"/>
  <text x="990" y="459" class="node-title">Risk Handling</text>

  <path d="M430 488 L430 535" class="line"/>
  <path d="M1170 488 L1170 535" class="line"/>

  <rect x="180" y="535" width="500" height="82" class="box"/>
  <text x="220" y="576" class="metric">Trade Count</text>
  <text x="220" y="607" class="note">거래 빈도와 turnover 감소를 나타냄</text>

  <rect x="180" y="645" width="500" height="82" class="box"/>
  <text x="220" y="686" class="metric">Avg Return</text>
  <text x="220" y="717" class="note">거래 1회당 평균 수익성을 나타냄</text>

  <rect x="180" y="755" width="500" height="82" class="box"/>
  <text x="220" y="796" class="metric">Win Rate</text>
  <text x="220" y="827" class="note">수익 거래의 비율을 나타냄</text>

  <rect x="920" y="535" width="500" height="82" class="box"/>
  <text x="960" y="576" class="metric">Sharpe</text>
  <text x="960" y="607" class="note">수익의 일관성과 안정성을 나타냄</text>

  <rect x="920" y="645" width="500" height="82" class="box"/>
  <text x="960" y="686" class="metric">Max Drawdown</text>
  <text x="960" y="717" class="note">전략의 최대 누적 손실 위험을 나타냄</text>

  <text x="430" y="873" text-anchor="middle" class="small">How often and how efficiently trades are executed</text>
  <text x="1170" y="873" text-anchor="middle" class="small">How stable returns are under downside risk</text>
</svg>
